spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

jwt.secret.access.token=${JWT_SECRET_ACCESS_TOKEN}
jwt.secret.refresh.token=${JWT_SECRET_REFRESH_TOKEN}
jwt.validity.access.token=${JWT_VALIDITY_ACCESS_TOKEN:3600}
jwt.validity.refresh.token=${JWT_VALIDITY_REFRESH_TOKEN:18000}
