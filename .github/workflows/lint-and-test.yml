name: Backend CI - Lint & Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for reviewdog to comment on PRs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Run Tests
        run: mvn clean test

      - name: Run Checkstyle Linter
        run: mvn checkstyle:checkstyle

      - name: Post Checkstyle Annotations with Reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-checkstyle@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_path: "**/target/checkstyle-result.xml"
          reporter: github-pr-review
          level: warning